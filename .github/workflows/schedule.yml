name: Post LinkedIn

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular execucao (ignora database e nao publica)"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar token do LinkedIn
        id: token_check
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python scripts/validate_linkedin_token.py

      - name: Criar Issue de aviso token expirando
        if: steps.token_check.outputs.token_expiring_soon == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const days = '${{ steps.token_check.outputs.days_left }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `LinkedIn token expira em ${days} dias`,
              body: [
                `O \`LINKEDIN_ACCESS_TOKEN\` expira em **${days} dias**.`,
                '',
                '**Renovar:**',
                '1. Rode `python3 scripts/get_linkedin_token.py` localmente',
                '2. Copie o novo `ACCESS_TOKEN` impresso',
                '3. Atualize o secret `LINKEDIN_ACCESS_TOKEN` em:',
                '   Settings > Secrets > Actions > LINKEDIN_ACCESS_TOKEN',
              ].join('\n'),
              labels: ['maintenance'],
            });

      - name: Publicar post no LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN:   ${{ secrets.LINKEDIN_MEMBER_URN }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:            ${{ vars.GROQ_MODEL }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_PROMPT:      ${{ vars.EDITORIAL_PROMPT }}
          SUMMARIZE_PROMPT:      ${{ vars.SUMMARIZE_PROMPT }}
          LINKEDIN_ENABLE_ARTICLE_PREVIEW: "0"
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mv newsbot/db.sqlite newsbot/db.sqlite.bak 2>/dev/null || true
          fi
          python -m newsbot.main
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            mv newsbot/db.sqlite.bak newsbot/db.sqlite 2>/dev/null || true
          fi

      - name: Persistir banco de dados
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsbot/db.sqlite
          git diff --cached --quiet || git commit -m "chore: atualiza db.sqlite"
          git push
