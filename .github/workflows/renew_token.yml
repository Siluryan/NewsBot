name: Renew - Token LinkedIn

on:
  schedule:
    - cron: "0 8 1 */2 *"
  workflow_dispatch: {}

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install requests PyNaCl playwright

      - name: Instalar browsers Playwright
        run: python -m playwright install chromium --with-deps

      - name: Renovar access_token via Playwright
        id: renew
        env:
          LINKEDIN_EMAIL:         ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD:      ${{ secrets.LINKEDIN_PASSWORD }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_SCOPE:         "openid profile w_member_social"
          GITHUB_PAT:             ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
        run: python scripts/auto_renew_token.py

      - name: Validar novo token
        env:
          LINKEDIN_ACCESS_TOKEN:  ${{ steps.renew.outputs.access_token }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python scripts/validate_linkedin_token.py

      - name: Criar Issue de confirmacao
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString().split('T')[0];
            const next = new Date(Date.now() + 55*24*60*60*1000).toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Token LinkedIn renovado em ${now}`,
              body: [
                '## Token renovado via Playwright',
                '',
                `- **Data:** ${now}`,
                `- **Proxima renovacao automatica:** ${next}`,
                '- **Secret atualizado:** `LINKEDIN_ACCESS_TOKEN`',
                '',
                '_Feche essa issue._',
              ].join('\n'),
              labels: ['maintenance'],
            });

      - name: Criar Issue de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha ao renovar token LinkedIn em ${now}`,
              body: [
                '## Renovacao automatica falhou',
                '',
                'Possiveis causas:',
                '- LinkedIn pediu 2FA ou CAPTCHA no login',
                '- Senha alterada (atualize o secret `LINKEDIN_PASSWORD`)',
                '- App revogado ou permissoes removidas',
                '',
                '**Acao necessaria:**',
                '1. Rode `python3 scripts/get_linkedin_token.py` localmente',
                '2. Copie o `ACCESS_TOKEN`',
                '3. Atualize o secret `LINKEDIN_ACCESS_TOKEN` em Settings > Secrets',
                '',
                'Verifique os logs da Action para mais detalhes.',
              ].join('\n'),
              labels: ['maintenance', 'bug'],
            });
